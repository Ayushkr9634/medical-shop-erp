<!DOCTYPE html>
<html>

<head>

<title>Forgot Password</title>

<style>

body{
font-family:Arial;
background:#eef2f7;
}

.container{
width:420px;
margin:70px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 2px 12px rgba(0,0,0,.15);
}

h2{
margin-top:0;
}

input{
width:100%;
padding:12px;
margin-top:5px;
margin-bottom:18px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:6px;
cursor:pointer;
font-size:15px;
font-weight:bold;
}

button:hover{
background:#1d4ed8;
}

a{
text-decoration:none;
color:#2563eb;
}

.errorlist{
color:#dc2626;
padding-left:18px;
}

</style>

</head>

<body>

<div class="container">

<h2>

Forgot Password

</h2>

<p>

Enter your registered email address.

</p>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

Send OTP

</button>

</form>

<br>

<a href="{% url 'login' %}">

← Back to Login

</a>

</div>

</body>

</html>
