<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<style>

body{

font-family:Arial;

background:#eef2f7;

}

.container{

width:420px;

margin:70px auto;

background:white;

padding:30px;

border-radius:10px;

box-shadow:0 2px 12px rgba(0,0,0,.15);

}

input{

width:100%;

padding:12px;

margin-bottom:18px;

border:1px solid #ccc;

border-radius:6px;

box-sizing:border-box;

}

button{

width:100%;

padding:12px;

background:#2563eb;

color:white;

border:none;

border-radius:6px;

cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

</style>

</head>

<body>

<div class="container">

<h2>

Create New Password

</h2>

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

Reset Password

</button>

</form>

</div>

</body>

</html>
