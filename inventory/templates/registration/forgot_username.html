<!DOCTYPE html>

<html>

<head>

<title>

Forgot Username

</title>

<style>

body{

font-family:Arial;

background:#eef2f7;

}

.container{

width:420px;

margin:70px auto;

background:white;

padding:30px;

border-radius:10px;

box-shadow:0 2px 12px rgba(0,0,0,.15);

}

input{

width:100%;

padding:10px;

margin-top:5px;

margin-bottom:15px;

border:1px solid #ccc;

border-radius:6px;

}

button{

width:100%;

padding:12px;

background:#2563eb;

color:white;

border:none;

border-radius:6px;

cursor:pointer;

}

.success{

background:#dcfce7;

padding:10px;

margin-bottom:15px;

border-radius:6px;

color:#166534;

}

.error{

background:#fee2e2;

padding:10px;

margin-bottom:15px;

border-radius:6px;

color:#991b1b;

}

a{

text-decoration:none;

color:#2563eb;

}

</style>

</head>

<body>

<div class="container">

<h2>

Forgot Username

</h2>

<p>

Enter your registered Email OR Mobile Number.

</p>


{% if username %}

<div class="success">

Your Username is

<strong>

{{ username }}

</strong>

</div>

{% endif %}

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button>

Find Username

</button>

</form>

<br>

<a href="{% url 'login' %}">

← Back to Login

</a>

</div>

</body>

</html>
