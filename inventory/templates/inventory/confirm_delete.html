{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom:15px;">

    <a href="javascript:history.back()"
       style="
       background:#6c757d;
       color:white;
       padding:8px 15px;
       text-decoration:none;
       border-radius:5px;
       display:inline-block;
       ">
        ← Back
    </a>

</div>
<h1>Delete Medicine</h1>

<p>

Are you sure you want to delete

<strong>

{{ medicine.name }}

</strong>

?

</p>

<form method="POST">

    {% csrf_token %}

    <button type="submit">

        Delete

    </button>

</form>

<br>

<a href="/dashboard/medicines/">

    Cancel

</a>

{% endblock %}
