{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom:15px;">

    <a href="javascript:history.back()"

       padding:8px 15px;

</div>
<h1>Add Purchase</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Save Purchase
    </button>

</form>

{% endblock %}
