{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom:15px;">

    <a href="javascript:history.back()"
       style="
       background:#6c757d;
       color:white;
       padding:8px 15px;
       text-decoration:none;
       border-radius:5px;
       display:inline-block;
       ">
        ← Back
    </a>

</div>
<h1>Restore Database</h1>

<p style="color:red;">

Warning:
Restoring a backup may overwrite
current data.

</p>

<form
method="POST"
enctype="multipart/form-data"
>

{% csrf_token %}

{{ form.as_p }}

<button type="submit">

Restore Database

</button>

</form>

{% endblock %}
